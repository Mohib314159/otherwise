<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Otherwise">
<title>Otherwise — Track record</title>
<meta name="description" content="Every known-answer site the tool has been run on, misses included.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icon-180.png">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css">
<style>
  .page-head { padding: 44px 0 8px; }
  .page-head h1 { font-size: 32px; font-weight: 600; letter-spacing: -0.02em; }
  .page-head p { max-width: 640px; margin-top: 12px; color: var(--muted); }
  .summary-line { margin-top: 18px; font-size: 14px; }
  .table-wrap { margin-top: 24px; padding-bottom: 40px; }
  td.verdict-cell { font-weight: 500; }
  .v-REAL.verdict-cell, .v-NOT_REAL.verdict-cell, .v-CANT_TELL.verdict-cell { font-weight: 500; }
</style>
<!-- after the block above so it wins the cascade at equal specificity -->
<link rel="stylesheet" href="/static/mobile.css">
<link rel="stylesheet" href="/static/desktop.css">
</head>
<body class="page-track">
<div class="container">
  <div class="topbar">
    <a class="wordmark" href="/">Otherwise</a>
    <div class="topbar-right">
      <a class="topbar-new" href="/#new">New check</a>
      <a href="/batch">Batch</a>
    </div>
  </div>

  <main id="content">
    <div class="loading-state">Loading track record&hellip;</div>
  </main>

  <div id="site-footer" class="site-footer"></div>
</div>

<script type="module" src="/static/track.js"></script>
<script type="module" src="/static/pwa.js"></script>
</body>
</html>
