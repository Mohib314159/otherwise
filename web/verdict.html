<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Otherwise</title>
<meta name="description" content="A verdict: did this area change more than it would have anyway?">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="/static/app.css">
<style>
  .hero { padding: 48px 0 40px; }
  .hero .label { margin-bottom: 10px; }
  .hero-label-line { font-size: 20px; margin: 6px 0 2px; }
  .statement { font-size: 18px; line-height: 1.5; max-width: 720px; margin-top: 14px; }
  .reasons-why { margin-top: 18px; }
  .reasons-why ul { margin: 8px 0 0; padding-left: 20px; }
  .reasons-why li { margin: 4px 0; font-size: 14px; }

  section.block { padding: 32px 0; border-top: 1px solid var(--rule); }
  .chart-caption { color: var(--muted); font-size: 13px; margin-top: 8px; }
  .chart-block + .chart-block { margin-top: 28px; }
  .chart-block h3 { font-size: 14px; font-weight: 500; margin-bottom: 10px; }

  .imagery-grid { display: flex; gap: 20px; flex-wrap: wrap; margin-top: 14px; }
  .imagery-grid figure { margin: 0; flex: 1 1 320px; max-width: 480px; }
  .imagery-grid img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border: 1px solid var(--rule); border-radius: 4px; display: block; }
  .imagery-grid figcaption { font-size: 13px; color: var(--muted); margin-top: 6px; }

  .effect-number { font-size: 34px; font-weight: 600; letter-spacing: -0.01em; margin-top: 8px; }
  .effect-sub { font-size: 13px; color: var(--muted); margin-top: 6px; }
  .numberline-wrap { margin-top: 14px; }

  .placebo-sentence { font-size: 14px; margin-top: 8px; line-height: 1.5; }
  .fake-dates { margin-top: 14px; }
  .fake-dates .label { margin-bottom: 6px; }
  .fake-dates ul { list-style: none; padding: 0; margin: 0; font-size: 13px; }
  .fake-dates li { padding: 5px 0; border-bottom: 1px solid var(--rule); }
  .fake-dates li:last-child { border-bottom: none; }
  .false-alarm { color: var(--notreal); }

  .radar-row { padding: 8px 0; border-bottom: 1px solid var(--rule); font-size: 14px; }
  .radar-row:last-of-type { border-bottom: none; }
  .radar-row .rlabel { font-weight: 500; }

  #control-map { height: 300px; border: 1px solid var(--rule); border-radius: 4px; margin-top: 10px; }
  .map-caption { font-size: 12px; color: var(--muted); margin-top: 8px; line-height: 1.5; }

  .receipts-summary { font-size: 14px; margin: 10px 0 16px; }
  .receipt-more { color: var(--muted); font-size: 12px; padding: 6px 8px; }

  .method-lines { font-size: 14px; margin-top: 8px; line-height: 1.6; }
  .method-links { margin-top: 10px; font-size: 13px; }
  .method-links a { margin-right: 14px; }
  .run-stats { margin-top: 18px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<div class="container">
  <div class="topbar">
    <a class="wordmark" href="/">Otherwise</a>
    <div class="topbar-right">
      <button class="btn btn-quiet" id="copy-link-btn" type="button" style="display:none;">Copy link</button>
      <a href="/track-record">Track record</a>
    </div>
  </div>

  <main id="content">
    <div class="loading-state">Loading verdict&hellip;</div>
  </main>

  <div id="site-footer" class="site-footer"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script type="module" src="/static/verdict.js"></script>
</body>
</html>
